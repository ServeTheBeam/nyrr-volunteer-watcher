name: NYRR volunteer watch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few minutes)
  workflow_dispatch: {}       # manual "Run workflow" button for testing

permissions:
  contents: write             # to commit state.json back
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
concurrency:
  group: nyrr-volunteer-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: jeffreyschwartz@yahoo.com
          ONLY_NINE_PLUS_ONE: "true"
        run: python check.py

      - name: Commit state if changed
        run: |
          git config user.email "nyrr-watcher-bot@users.noreply.github.com"
          git add .
          git commit -m "state: $(date -u +'%Y-%m-%dT%H:%M')" || exit 0
          git pull --rebase origin main
          git push origin main
          
