name: NYRR volunteer watch

on:
  schedule:
    # Only a restart signal, not the check cadence. GitHub drops most
    # scheduled triggers for this account (~8 of 96 a day), so the job below
    # loops internally rather than relying on this firing on time.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: nyrr-volunteer-watcher
  # A fresh trigger replaces a loop still running, rather than queueing
  # behind it for hours.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Under the 6h job ceiling, with room for setup before the 5h30m loop.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run parser tests
        run: python -m unittest discover -s tests

      - name: Configure git
        run: |
          git config user.email "nyrr-watcher-bot@users.noreply.github.com"
          git config user.name "nyrr-watcher-bot"

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ONLY_NINE_PLUS_ONE: "true"
          EXCLUDE_TAGS: "medical"
          CHECK_INTERVAL: "900"
          LOOP_DURATION: "19800"
        run: scripts/watch_loop.sh
