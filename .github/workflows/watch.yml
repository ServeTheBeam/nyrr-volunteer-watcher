name: NYRR volunteer watch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay a few minutes)
  workflow_dispatch: {}       # manual "Run workflow" button for testing

permissions:
  contents: write             # to commit state.json back

concurrency:
  group: nyrr-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONLY_NINE_PLUS_ONE: "true"
        run: python check.py

      - name: Commit state if changed
        run: |
          git config user.name "nyrr-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M)" && git push
