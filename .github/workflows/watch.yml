name: NYRR volunteer watch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: nyrr-volunteer-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install dependencies
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run parser tests
        run: python -m unittest discover -s tests

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ONLY_NINE_PLUS_ONE: "true"
          EXCLUDE_TAGS: "medical"
        run: python check.py

      - name: Commit state
        run: |
          git config user.email "nyrr-watcher-bot@users.noreply.github.com"
          git config user.name "nyrr-watcher-bot"

          git add state.json

          if git diff --staged --quiet; then
            echo "state unchanged"
            exit 0
          fi

          # Concurrent runs both rewrite state.json, so a rebase is guaranteed
          # to conflict. The freshest scrape is the one worth keeping: replay
          # our state onto whatever main has and push again.
          cp state.json "$RUNNER_TEMP/state.json"

          for attempt in 1 2 3; do
            git commit -qm "state: $(date -u +'%Y-%m-%dT%H:%M')"

            if git push -q origin main; then
              echo "state pushed (attempt $attempt)"
              exit 0
            fi

            echo "push rejected — replaying state onto latest main"
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            git add state.json

            if git diff --staged --quiet; then
              echo "state already current on main"
              exit 0
            fi
          done

          echo "could not push state after 3 attempts"
          exit 1
